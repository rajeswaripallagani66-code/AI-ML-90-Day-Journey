@"
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-agentic-ai-assistant
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Run Manual Evaluation
        env:
          GEMINI_API_KEY: `${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: `${{ secrets.GROQ_API_KEY }}
        run: python evaluate_manual.py
"@ | Set-Content .github\workflows\ci.yml