apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
    spec:
      containers:
            - name: ml-api
              image: ml-api:latest
              imagePullPolicy: Never
              env:
                - name: MODEL_PATH
              value: "app/resnet18.onnx"
              ports:
                - containerPort: 8000
              livenessProbe:
              httpGet:
              path: /health
              port: 8000
              initialDelaySeconds: 10
              periodSeconds: 10
              readinessProbe:
              httpGet:
              path: /health
              port: 8000
              initialDelaySeconds: 5
              periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-api-service
spec:
  selector:
    app: ml-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
  