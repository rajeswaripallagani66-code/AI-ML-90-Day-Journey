<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Agentic AI Assistant</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:20px}
.box{max-width:650px;margin:auto;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);overflow:hidden}
.head{background:#1a73e8;color:#fff;padding:16px;text-align:center}
.head h2{margin:0}.head p{margin:4px 0 0;opacity:.9;font-size:13px}
#chat{height:420px;overflow-y:auto;padding:16px}
.msg{margin:8px 0;padding:10px 14px;border-radius:12px;max-width:85%;line-height:1.5;font-size:14px;white-space:pre-wrap}
.user{background:#1a73e8;color:#fff;margin-left:auto}
.bot{background:#eef2f7}
.input{display:flex;padding:12px;border-top:1px solid #ddd}
input{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px;outline:none}
button{margin-left:8px;padding:12px 20px;background:#1a73e8;color:#fff;border:none;border-radius:20px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.chips button{background:#eef2f7;color:#333;padding:6px 12px;font-size:12px}
</style>
</head>
<body>
<div class="box">
<div class="head"><h2>🤖 HR Agentic AI Assistant</h2><p>Ask about Leave Policy • Leave Balance • WFH</p></div>
<div id="chat"><div class="msg bot">Hi! I can help with HR policies. Try asking:<br>• What is casual leave policy?<br>• How many leaves do I have left?</div></div>
<div class="chips">
<button onclick="ask('What is casual leave policy?')">Casual Leave Policy</button>
<button onclick="ask('How many leaves do I have left?')">My Leave Balance</button>
<button onclick="ask('What is sick leave policy?')">Sick Leave Policy</button>
</div>
<div class="input"><input id="q" placeholder="Ask HR question..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div>
</div>
<script>
const chat=document.getElementById('chat');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
async function ask(t){document.getElementById('q').value=t;send();}
async function send(){
 let q=document.getElementById('q').value.trim(); if(!q) return;
 add(q,'user'); document.getElementById('q').value='';
 add('Thinking...','bot');
 try{
  let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,user_id:'default'})});
  let j=await r.json();
  chat.lastChild.remove();
  add(j.answer,'bot');
 }catch(e){chat.lastChild.remove();add('Error: Server busy, try again','bot');}
}
</script>
</body>
</html>
