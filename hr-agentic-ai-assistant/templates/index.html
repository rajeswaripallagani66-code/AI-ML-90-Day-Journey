<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Agentic AI Assistant</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial, sans-serif;background:#f0f2f5;margin:0;padding:16px}
  .box{max-width:680px;margin:auto;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.12);overflow:hidden}
  .head{background:#1a73e8;color:#fff;padding:18px;text-align:center}
  .head h2{margin:0;font-size:22px}
  .head p{margin:6px 0 0;opacity:.9;font-size:13px}
  #chat{height:440px;overflow-y:auto;padding:16px;background:#fbfbfc}
  .msg{margin:8px 0;padding:11px 14px;border-radius:14px;max-width:88%;line-height:1.6;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
  .user{background:#1a73e8;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .bot{background:#eef2f7;color:#111;border-bottom-left-radius:4px}
  .meta{font-size:11px;color:#777;margin:4px 4px 10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
  .chips button{background:#eef2f7;border:1px solid #ddd;color:#333;padding:7px 12px;font-size:12px;border-radius:20px;cursor:pointer}
  .chips button:hover{background:#dbeafe}
  .input{display:flex;padding:12px;border-top:1px solid #eee;gap:8px}
  input{flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:24px;outline:none;font-size:14px}
  button.send{padding:12px 22px;background:#1a73e8;color:#fff;border:none;border-radius:24px;cursor:pointer;font-weight:bold}
  button.send:disabled{opacity:.6}
</style>
</head>
<body>
<div class="box">
  <div class="head">
    <h2>🤖 HR Agentic AI Assistant</h2>
    <p>Ask about Leave Policy • Leave Balance • WFH • Sick Leave</p>
  </div>

  <div id="chat">
    <div class="msg bot">Hi! 👋 I can help with HR policies.
Try asking:
• What is casual leave policy?
• How many casual leaves do I have left?
• What is sick leave policy?</div>
  </div>

  <div class="chips">
    <button onclick="ask('What is casual leave policy?')">Casual Leave Policy</button>
    <button onclick="ask('How many casual leaves do I have left?')">My Leave Balance</button>
    <button onclick="ask('What is sick leave policy?')">Sick Leave Policy</button>
    <button onclick="ask('What is WFH policy?')">WFH Policy</button>
  </div>

  <div class="input">
    <input id="q" placeholder="Ask: What is casual leave policy?" autocomplete="off" onkeydown="if(event.key==='Enter')send()">
    <button class="send" id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const sendBtn = document.getElementById('sendBtn');

function add(text, cls){
  let d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function ask(t){
  input.value = t;
  send();
}

async function send(){
  let q = input.value.trim();
  if(!q) return;
  add(q, 'user');
  input.value = '';
  sendBtn.disabled = true;
  let thinking = add('Thinking...', 'bot');
  let start = Date.now();
  try{
    let r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: q, user_id: 'default'})
    });
    let j = await r.json();
    // FIX: Accept answer OR response OR reply - any name backend sends
    let txt = j.answer || j.response || j.reply || j.output || j.result || JSON.stringify(j);
    thinking.innerText = txt;
    let latency = ((Date.now() - start)/1000).toFixed(1);
    let src = j.source || 'Policy Doc';
    let m = document.createElement('div');
    m.className = 'meta';
    m.innerText = 'Source: ' + src + ' • Latency: ' + latency + 's';
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  }catch(e){
    thinking.innerText = 'Error: Server busy, please try again. ' + e;
  }
  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
