<!DOCTYPE html>
<html>
<head><title>HR Agentic AI</title>
<style>
body{font-family:Arial;max-width:600px;margin:40px auto;padding:20px}
#chat{border:1px solid #ddd;height:400px;overflow-y:auto;padding:15px;border-radius:10px}
.msg{margin:10px 0;padding:10px;border-radius:8px}
.user{background:#e3f2fd;text-align:right}
.ai{background:#f1f1f1}
input{width:75%;padding:10px} button{padding:10px 20px;background:#000;color:#fff;border:none;cursor:pointer}
small{color:#888}
</style>
</head>
<body>
<h2>🤖 HR Agentic AI Assistant</h2>
<div id="chat"></div><br>
<input id="q" placeholder="Ask: What is casual leave policy?">
<button onclick="send()">Send</button>
<script>
async function send(){
  let q=document.getElementById('q').value;
  let chat=document.getElementById('chat');
  chat.innerHTML+=`<div class="msg user">${q}</div>`;
  let start=Date.now();
  let res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
  let data=await res.json();
  let latency=Date.now()-start;
  chat.innerHTML+=`<div class="msg ai">${data.answer}<br><small>Source: ${data.source || 'Policy Doc'} | Latency: ${latency}ms</small></div>`;
  document.getElementById('q').value='';
  chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
