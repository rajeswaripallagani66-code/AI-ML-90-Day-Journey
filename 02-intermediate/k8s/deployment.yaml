apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-report-card
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-report-card
  template:
    metadata:
      labels:
        app: student-report-card
    spec:
      containers:
            - name: student-report-card
        image: 065020505197.dkr.ecr.ap-south-1.amazonaws.com/ml-api:day3
        
        ports:
                - containerPort: 8000
          name: fastapi
                - containerPort: 8501
          name: streamlit