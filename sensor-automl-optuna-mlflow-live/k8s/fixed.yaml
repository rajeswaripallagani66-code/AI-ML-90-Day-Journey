apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
    spec:
      containers:
            - name: ml-api
              image: ml-api:v2
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ml-api-svc
spec:
  selector:
    app: ml-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
  
