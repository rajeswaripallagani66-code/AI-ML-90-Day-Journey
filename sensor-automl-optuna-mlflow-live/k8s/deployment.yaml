apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-automl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sensor-automl
  template:
    metadata:
      labels:
        app: sensor-automl
    spec:
      containers:
            - name: sensor-automl
              image: rajeswari/sensor-automl:latest
              ports:
                - containerPort: 8000
              resources:
              requests:
              cpu: "250m"
              memory: "512Mi"
              limits:
              cpu: "1"
              memory: "1Gi"
              readinessProbe:
              httpGet:
              path: /health
              port: 8000
              initialDelaySeconds: 10
              livenessProbe:
              httpGet:
              path: /health
              port: 8000
              initialDelaySeconds: 30